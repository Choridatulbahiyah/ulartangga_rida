<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ular Tangga Matematika - Kelas 3 SD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0fdf4;
            background-image: linear-gradient(rgba(240, 253, 244, 0.85), rgba(240, 253, 244, 0.85)), url('ulartangga_2.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        h1, h2, h3, .font-heading {
            font-family: 'Fredoka One', cursive;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0;
            max-width: 600px;
            margin: 0 auto;
            background-color: #000;
            border: 4px solid black;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .cell {
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            font-size: 1.25rem;
            font-weight: bold;
            transition: all 0.3s;
            border: 1px solid black;
        }
        .cell-number {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 1.2rem;
            color: black;
            font-family: 'Fredoka One', cursive;
        }
        /* Boustrophedon order (snaking grid) */
        .row-0 { grid-row: 5; }
        .row-1 { grid-row: 4; }
        .row-2 { grid-row: 3; }
        .row-3 { grid-row: 2; }
        .row-4 { grid-row: 1; }
        
        /* Alternating row directions */
        .dir-right { flex-direction: row; }
        .dir-left { flex-direction: row-reverse; }
        
        .player-token {
            width: 40px;
            height: 40px;
            background-color: #ef4444; /* Red token */
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: absolute;
            z-index: 10;
            transition: all 0.5s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
        }
        
        .cell-content {
            font-size: 1.8rem;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 50;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes diceRoll {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(90deg); }
            50% { transform: rotate(180deg); }
            75% { transform: rotate(270deg); }
            100% { transform: rotate(360deg); }
        }

        .rolling {
            animation: diceRoll 0.5s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen py-8 px-4 flex flex-col items-center">

    <div class="text-center mb-6 max-w-2xl">
        <h1 class="text-4xl text-emerald-600 mb-2 drop-shadow-md">🐍 Ular Tangga Matematika 🪜</h1>
        <p class="text-lg text-gray-700 font-bold">Fase B - Kelas 3 SD</p>
        <p class="text-sm text-gray-600">Jawab soal dengan benar untuk menetap! Jika salah, kamu harus mundur 1 langkah.</p>
    </div>

    <div class="flex flex-col md:flex-row gap-8 items-start w-full max-w-5xl justify-center">
        <!-- Control Panel -->
        <div class="bg-white p-6 rounded-2xl shadow-xl border-4 border-emerald-400 w-full md:w-1/3 flex flex-col items-center">
            <h2 class="font-heading text-2xl text-gray-800 mb-4">Giliranmu!</h2>
            
            <div id="dice-container" class="w-24 h-24 bg-gray-100 rounded-xl border-4 border-gray-300 flex items-center justify-center mb-6 shadow-inner text-5xl cursor-pointer hover:bg-gray-200 transition-colors">
                🎲
            </div>
            
            <button id="btn-roll" onclick="rollDice()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-heading text-xl py-3 px-6 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95">
                Kocok Dadu!
            </button>
            
            <div class="mt-8 w-full">
                <h3 class="font-bold text-gray-700 mb-2">Status Permainan:</h3>
                <div class="bg-blue-50 p-4 rounded-lg border border-blue-200">
                    <p class="text-sm text-gray-600">Posisi Saat ini:</p>
                    <p class="text-2xl font-heading text-blue-600" id="current-pos">Mulai (0)</p>
                </div>
                <div id="message-box" class="mt-4 p-3 rounded-lg text-sm font-bold text-center hidden">
                </div>
            </div>
        </div>

        <!-- Game Board -->
        <div class="w-full md:w-2/3 relative">
            <div id="board" class="board">
                <!-- Cells will be generated by JS -->
            </div>
        </div>
    </div>

    <!-- Question Modal -->
    <div id="question-modal" class="modal">
        <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full mx-4 border-4 border-blue-400">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-heading text-2xl text-blue-600">Kotak <span id="modal-square-num"></span></h2>
                <span id="modal-icon" class="text-3xl">❓</span>
            </div>
            <p id="modal-question" class="text-lg font-bold text-gray-800 mb-6"></p>
            <div id="modal-options" class="space-y-3">
                <!-- Options injected here -->
            </div>
        </div>
    </div>

    <!-- Feedback Modal (Correct/Wrong/Win) -->
    <div id="feedback-modal" class="modal">
        <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full mx-4 text-center border-4" id="feedback-content">
            <h2 id="feedback-title" class="font-heading text-3xl mb-4"></h2>
            <p id="feedback-desc" class="text-lg text-gray-700 mb-6"></p>
            <button onclick="closeFeedback()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2 px-6 rounded-full w-full">
                Lanjut
            </button>
        </div>
    </div>

    <script>
        // Game Data Setup
        const totalSquares = 25;
        let playerPos = 0;
        let isRolling = false;
        
        // Snakes and Ladders mapping
        const shortcuts = {
            3: { to: 8, type: 'ladder', msg: 'Naik Tangga!' },
            6: { to: 12, type: 'ladder', msg: 'Naik Tangga!' },
            11: { to: 15, type: 'ladder', msg: 'Naik Tangga!' },
            16: { to: 20, type: 'ladder', msg: 'Naik Tangga!' },
            22: { to: 24, type: 'ladder', msg: 'Naik Tangga!' },
            7: { to: 2, type: 'snake', msg: 'Tertelan Ular!' },
            13: { to: 9, type: 'snake', msg: 'Tertelan Ular!' },
            18: { to: 11, type: 'snake', msg: 'Tertelan Ular!' },
            23: { to: 16, type: 'snake', msg: 'Tertelan Ular!' }
        };

        // Questions Data
        const questions = {
            1: { q: "Hasil dari 125 + 75 adalah...", opts: ["150", "200", "250"], ans: 1 },
            2: { q: "Berapakah hasil dari 250 - 120?", opts: ["130", "140", "150"], ans: 0 },
            3: { q: "Hasil perkalian dari 6 x 7 adalah...", opts: ["36", "42", "48"], ans: 1 },
            4: { q: "Bentuk pembagian 36 : 4 hasilnya adalah...", opts: ["8", "9", "10"], ans: 1 },
            5: { q: "Angka 8 pada bilangan 8.432 menempati nilai...", opts: ["Ratusan", "Puluhan", "Ribuan"], ans: 2 },
            6: { q: "Ibu membeli 3 kg telur. Berapa gram berat telur tersebut?", opts: ["30 gram", "300 gram", "3.000 gram"], ans: 2 },
            7: { q: "Hasil dari 8 x 8 adalah...", opts: ["56", "64", "72"], ans: 1 },
            8: { q: "Berapakah hasil dari 45 : 5?", opts: ["7", "8", "9"], ans: 2 },
            9: { q: "Panjang meja 2 meter. Sama dengan berapa sentimeter (cm)?", opts: ["20 cm", "200 cm", "2.000 cm"], ans: 1 },
            10: { q: "Sebuah semangka dipotong menjadi 4 bagian sama besar. Satu bagian bernilai...", opts: ["1/2", "1/3", "1/4"], ans: 2 },
            11: { q: "1 jam sama dengan berapa menit?", opts: ["30 menit", "60 menit", "100 menit"], ans: 1 },
            12: { q: "Hasil dari 500 + 350 adalah...", opts: ["800", "850", "900"], ans: 1 },
            13: { q: "Berapakah 72 : 8?", opts: ["8", "9", "10"], ans: 1 },
            14: { q: "Sebulan biasanya terdiri dari berapa minggu?", opts: ["2 minggu", "3 minggu", "4 minggu"], ans: 2 },
            15: { q: "Hasil dari 9 x 6 adalah...", opts: ["54", "63", "72"], ans: 0 },
            16: { q: "Uang Rida Rp5.000, dibelikan pensil Rp2.000. Sisa uangnya adalah...", opts: ["Rp2.000", "Rp3.000", "Rp4.000"], ans: 1 },
            17: { q: "Bilangan ganjil setelah 123 adalah...", opts: ["124", "125", "126"], ans: 1 },
            18: { q: "Pecahan 2/4 sama besar dengan pecahan...", opts: ["1/2", "1/3", "1/5"], ans: 0 },
            19: { q: "Hasil dari 400 - 150 adalah...", opts: ["250", "300", "350"], ans: 0 },
            20: { q: "Terdapat 5 kantong plastik, masing-masing berisi 4 apel. Total apel adalah...", opts: ["15", "20", "25"], ans: 1 },
            21: { q: "Lengkapi urutan bilangan ini: 10, 15, 20, ..., 30.", opts: ["22", "25", "28"], ans: 1 },
            22: { q: "Berapakah hasil dari 81 : 9?", opts: ["8", "9", "10"], ans: 1 },
            23: { q: "Bangun datar yang memiliki 3 sisi dan 3 sudut adalah...", opts: ["Persegi", "Lingkaran", "Segitiga"], ans: 2 },
            24: { q: "Hasil dari 1.000 - 400 adalah...", opts: ["500", "600", "700"], ans: 1 },
            25: { q: "Berapakah hasil dari 7 x 9?", opts: ["56", "63", "72"], ans: 1 }
        };

        const colors = ['bg-[#fef08a]', 'bg-[#bbf7d0]', 'bg-[#bfdbfe]', 'bg-white', 'bg-[#e9d5ff]'];

        function initBoard() {
            const board = document.getElementById('board');
            
            // Create cells based on visual grid mapping
            let visualMap = [
                21, 22, 23, 24, 25, // row 4 (top)
                20, 19, 18, 17, 16, // row 3
                11, 12, 13, 14, 15, // row 2
                10, 9, 8, 7, 6,     // row 1
                1, 2, 3, 4, 5       // row 0 (bottom)
            ];

            visualMap.forEach((num, index) => {
                const cell = document.createElement('div');
                cell.className = `cell ${colors[num % colors.length]}`;
                cell.id = `cell-${num}`;
                
                let icon = '';
                if(shortcuts[num]) {
                    if(shortcuts[num].type === 'ladder') icon = '🪜';
                    if(shortcuts[num].type === 'snake') icon = '🐍';
                }

                cell.innerHTML = `
                    <span class="cell-number">${num}</span>
                    <span class="cell-content">${icon}</span>
                `;
                board.appendChild(cell);
            });

            // Create player token
            const token = document.createElement('div');
            token.id = 'player';
            token.className = 'player-token';
            token.innerHTML = '🧑‍🎓';
            document.body.appendChild(token);
            
            // Hide player initially off-board or at start
            updatePlayerPosition(0, true);
        }

        function getDiceEmoji(num) {
            const dice = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
            return dice[num - 1] || '🎲';
        }

        function rollDice() {
            if(isRolling) return;
            isRolling = true;
            document.getElementById('btn-roll').disabled = true;

            const diceElem = document.getElementById('dice-container');
            diceElem.classList.add('rolling');
            
            let rollInterval = setInterval(() => {
                diceElem.innerText = getDiceEmoji(Math.floor(Math.random() * 6) + 1);
            }, 100);

            setTimeout(() => {
                clearInterval(rollInterval);
                diceElem.classList.remove('rolling');
                
                const rollResult = Math.floor(Math.random() * 6) + 1;
                diceElem.innerText = getDiceEmoji(rollResult);
                
                showMessage(`Kamu mendapat angka ${rollResult}!`, 'bg-blue-100 text-blue-700 border-blue-300');
                
                movePlayer(rollResult);
            }, 600);
        }

        function getCellCoordinates(pos) {
            if (pos === 0) {
                // Return bottom-left outside the board temporarily
                const cell1 = document.getElementById('cell-1');
                if(!cell1) return {x: 0, y: 0};
                const rect = cell1.getBoundingClientRect();
                return { 
                    x: rect.left - 50 + window.scrollX, 
                    y: rect.top + window.scrollY + (rect.height / 2) - 20 
                };
            }
            
            const cell = document.getElementById(`cell-${pos}`);
            const rect = cell.getBoundingClientRect();
            // Center token in cell
            return {
                x: rect.left + window.scrollX + (rect.width / 2) - 20,
                y: rect.top + window.scrollY + (rect.height / 2) - 20
            };
        }

        function updatePlayerPosition(pos, instant = false) {
            const token = document.getElementById('player');
            const coords = getCellCoordinates(pos);
            
            if (instant) {
                token.style.transition = 'none';
            } else {
                token.style.transition = 'all 0.5s ease-in-out';
            }
            
            token.style.left = `${coords.x}px`;
            token.style.top = `${coords.y}px`;
            
            document.getElementById('current-pos').innerText = pos === 0 ? 'Mulai (0)' : `Kotak ${pos}`;
            
            // Adjust on window resize
            window.onresize = () => updatePlayerPosition(playerPos, true);
        }

        function movePlayer(steps) {
            let targetPos = playerPos + steps;
            
            // Bounce back if > 25
            if (targetPos > totalSquares) {
                targetPos = totalSquares; 
            }

            playerPos = targetPos;
            updatePlayerPosition(playerPos);

            // Wait for move animation to finish before asking question
            setTimeout(() => {
                triggerQuestion(playerPos);
            }, 600);
        }

        function triggerQuestion(pos) {
            const qData = questions[pos];
            if(!qData) return;

            document.getElementById('modal-square-num').innerText = pos;
            document.getElementById('modal-question').innerText = qData.q;
            
            const optionsContainer = document.getElementById('modal-options');
            optionsContainer.innerHTML = '';
            
            const labels = ['A', 'B', 'C'];
            
            qData.opts.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left bg-gray-50 hover:bg-blue-50 border-2 border-gray-200 hover:border-blue-400 p-4 rounded-xl transition font-bold text-gray-700 flex items-center';
                btn.innerHTML = `<span class="bg-blue-100 text-blue-700 w-8 h-8 rounded-full flex items-center justify-center mr-3 shrink-0">${labels[index]}</span> ${opt}`;
                btn.onclick = () => checkAnswer(pos, index, qData.ans);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('question-modal').classList.add('active');
        }

        function checkAnswer(pos, selected, correct) {
            document.getElementById('question-modal').classList.remove('active');
            
            if (selected === correct) {
                // Correct
                if (pos === totalSquares) {
                    showFeedback('Hore! Kamu Menang!', 'Selamat, kamu berhasil mencapai garis finis dan menjawab soal terakhir dengan benar! Kamu jago matematika!', 'border-yellow-400', 'bg-yellow-50');
                    // Reset game optionally here
                } else {
                    checkShortcut(pos);
                }
            } else {
                // Wrong
                let text = `Yah, jawabanmu kurang tepat. Kamu harus mundur 1 langkah ke kotak ${pos - 1}.`;
                if(pos === 1) text = `Jawaban salah, kembali ke titik awal.`;
                
                showFeedback('Jawaban Salah!', text, 'border-red-400', 'bg-red-50');
                
                // Move back
                setTimeout(() => {
                    playerPos = Math.max(0, playerPos - 1);
                    updatePlayerPosition(playerPos);
                }, 500);
            }
        }

        function checkShortcut(pos) {
            const cut = shortcuts[pos];
            if (cut) {
                const title = cut.type === 'ladder' ? 'Naik Tangga! 🪜' : 'Yaahh, Kena Ular! 🐍';
                const desc = `Kamu berada di kotak ${pos} dan harus ${cut.type === 'ladder' ? 'naik' : 'turun'} ke kotak ${cut.to}.`;
                const borderColor = cut.type === 'ladder' ? 'border-emerald-400' : 'border-red-400';
                const bgColor = cut.type === 'ladder' ? 'bg-emerald-50' : 'bg-red-50';
                
                showFeedback(title, desc, borderColor, bgColor);
                
                setTimeout(() => {
                    playerPos = cut.to;
                    updatePlayerPosition(playerPos);
                }, 500);
            } else {
                showFeedback('Jawaban Benar! 🎉', 'Hebat! Posisi kamu aman di kotak ini.', 'border-emerald-400', 'bg-emerald-50');
            }
        }

        function showFeedback(title, desc, borderCls, bgCls) {
            const content = document.getElementById('feedback-content');
            content.className = `bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full mx-4 text-center border-4 ${borderCls} ${bgCls}`;
            
            document.getElementById('feedback-title').innerText = title;
            document.getElementById('feedback-desc').innerText = desc;
            document.getElementById('feedback-modal').classList.add('active');
        }

        function closeFeedback() {
            document.getElementById('feedback-modal').classList.remove('active');
            isRolling = false;
            document.getElementById('btn-roll').disabled = false;
        }

        function showMessage(msg, classes) {
            const box = document.getElementById('message-box');
            box.className = `mt-4 p-3 rounded-lg text-sm font-bold text-center border ${classes}`;
            box.innerText = msg;
            box.classList.remove('hidden');
        }

        window.onload = () => {
            initBoard();
        };
    </script>
</body>
</html>
